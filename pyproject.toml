[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mammal"
version = "0.1.0"
description = "Metacognitive Assessment & Machine Modeling of an Adaptive Learner"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jonathan Lane" }
]
dependencies = [
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "PyYAML>=6.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
mammal = "mammal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
