<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Project MAMMAL // Mammal Pod{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-title">MAMMAL POD // CODEC</span>
    </div>
    <div>
      <span class="mode-badge">{% block mode_badge %}OBSERVATION MODE{% endblock %}</span>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
